name: Release del plugin

# Workflow aislado: crea el GitHub Release con el ZIP como asset. Vive aparte del
# de Pages y SIN concurrency con él, para que el job que crea el Release nunca
# pueda ser cancelado por la cola del grupo 'pages'.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Empaquetar plugin
        run: python scripts/build_release.py
      - name: Crear Release y subir el ZIP
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/qcensosbo.zip \
            --title "$GITHUB_REF_NAME" --generate-notes

      # El repositorio oficial es la vía por la que QGIS avisa de actualizaciones.
      # Se salta si no hay token configurado, para que el release de GitHub siga
      # funcionando en un fork o antes de crear el secreto.
      - name: Publicar en el repositorio oficial de QGIS
        if: ${{ secrets.OSGEO_PLUGIN_TOKEN != '' }}
        env:
          OSGEO_PLUGIN_TOKEN: ${{ secrets.OSGEO_PLUGIN_TOKEN }}
        run: scripts/publish_osgeo.sh

      - name: Avisar si no hay token
        if: ${{ secrets.OSGEO_PLUGIN_TOKEN == '' }}
        run: |
          echo "::warning::Sin OSGEO_PLUGIN_TOKEN: la versión NO se publicó en \
          plugins.qgis.org. Créalo en la página del plugin (botón «Tokens») y \
          guárdalo con: gh secret set OSGEO_PLUGIN_TOKEN"
